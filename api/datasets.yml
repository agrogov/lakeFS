openapi: "3.0.1"

info:
  title: lakeFS datasets API
  description: |
    Control plane of the lakeFS datasets feature (DATASETS_DESIGN.md §10).

    A dataset is a named, versioned, read-only collection of data curated from one or more
    repositories, materialised as a read-only lakeFS repository with the same name. This
    specification covers the control plane only; reading dataset data uses the regular
    repository/S3-gateway read paths (`lakefs://<dataset>/<ref>/<path>`).

    Every operation requires authentication with one of the schemes declared below. Errors use
    the core lakeFS error shape `{"message": "..."}`; validation failures add an `errors` list
    with one entry per problem (§10.4).

    Generated server stubs live in `pkg/datasets/apigen` (`//go:generate` in
    `pkg/datasets/http.go`).
  version: 0.1.0
  license:
    name: "Apache 2.0"
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  # Paths below are relative to this base path so the generated chi routes line up with the
  # router the datasets package mounts (pkg/datasets.APIBasePath). The validator also resolves
  # request paths through this server entry (DATASETS_DESIGN.md §10).
  - url: "/api/v1/datasets"
    description: lakeFS datasets control plane

security:
  - jwt_token: []
  - basic_auth: []
  - cookie_auth: []
  - oidc_auth: []
  - saml_auth: []

tags:
  - name: datasets
    description: Dataset lifecycle, versions, diffs and pull requests
  - name: metadata
    description: Metadata key definitions used to type dataset metadata
  - name: access
    description: Dataset-level access grants
  - name: config
    description: Datasets feature configuration, for clients that need to gate themselves

paths:
  /:
    get:
      operationId: listDatasets
      tags: [datasets]
      summary: List datasets
      description: |
        Paginated list of datasets with the latest version summary (§10.1). Results are
        filtered by `dataset:ReadDataset` in addition to requiring `dataset:ListDatasets`.

        Metadata filters use dynamic query parameters of the form `metadata.<key>=<value>` and
        match against the latest version's metadata. OpenAPI 3.0 cannot declare dynamic query
        parameter names, so they are documented here rather than declared below; unknown query
        parameters are passed through to the handler.
      parameters:
        - $ref: "#/components/parameters/Prefix"
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Amount"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Dataset list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: createDataset
      tags: [datasets]
      summary: Create a dataset
      description: |
        Creates the dataset, its backing repository and version `v1` (§5.1, §6.1): every
        create publishes a version, as the documentation says. `publish.message` is the v1
        message and defaults to `Create dataset <name>`. The answer is the created `Dataset`.

        The publish runs in the request by default. `async=true` keeps the undocumented
        asynchronous behaviour of this build: the publish runs as a task and the answer is
        `202` with the task to poll at `GET /{dataset}/tasks/{task_id}` (§6.5).
      parameters:
        - name: async
          in: query
          required: false
          description: |
            Publish version `v1` asynchronously and answer `202` with a task instead of
            waiting. An extension of this build; the documented create is synchronous.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetCreateRequest"
      responses:
        "201":
          description: Dataset created and version v1 published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "202":
          description: Dataset created; the initial publish runs asynchronously
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /config:
    get:
      operationId: getDatasetsConfig
      tags: [config]
      summary: Datasets feature configuration
      description: |
        Configuration the UI needs to gate itself (§10.1, §11). Requires authentication but no
        dataset permission. Datasets disabled on this server is reported by the configured
        value rather than by `501` when the control plane is reachable; a disabled control plane
        answers `501` for every datasets route.
      responses:
        "200":
          description: Datasets configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetsConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /metadata:
    get:
      operationId: listMetadataKeys
      tags: [metadata]
      summary: List metadata keys
      description: |
        Every metadata key definition (needed by every definition editor, §5.5), optionally
        filtered to names starting with `prefix`.
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Amount"
        - $ref: "#/components/parameters/Prefix"
      responses:
        "200":
          description: Metadata key list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataKeyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: createMetadataKey
      tags: [metadata]
      summary: Create a metadata key
      description: |
        Creates a typed metadata key (§5.5). Metadata keys are global, not per dataset.
        Requires `dataset:CreateMetadataKey` on `arn:lakefs:dataset:::dataset/*`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataKeyCreateRequest"
      responses:
        "201":
          description: Metadata key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /metadata/{key}:
    parameters:
      - $ref: "#/components/parameters/MetadataKeyName"
    get:
      operationId: getMetadataKey
      tags: [metadata]
      summary: Get a metadata key
      responses:
        "200":
          description: Metadata key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    put:
      operationId: updateMetadataKey
      tags: [metadata]
      summary: Replace a metadata key
      description: |
        Full replacement: `type` is required and the absent optional fields reset to their
        zero values. Changing `type` is rejected (`409`): delete and recreate the key
        instead. Existing dataset versions are never re-validated, so a new required key
        affects only the next definition write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataKeyUpdateRequest"
      responses:
        "200":
          description: Updated metadata key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: deleteMetadataKey
      tags: [metadata]
      summary: Delete a metadata key
      description: |
        Deletes the definition only; existing metadata values become free-form (§5.5).
      responses:
        "204":
          description: Metadata key deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /{dataset}:
    parameters:
      - $ref: "#/components/parameters/DatasetName"
    get:
      operationId: getDataset
      tags: [datasets]
      summary: Get a dataset
      description: The dataset record plus the definition of its latest version (§10.1).
      responses:
        "200":
          description: Dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    put:
      operationId: updateDataset
      tags: [datasets]
      summary: Update a dataset
      description: |
        Publishes `definition` as version `version + 1` (§5.4, §6.2): materialises the
        definition into the dataset repository, commits `latest`, tags `vN` and records the
        version. The publish is synchronous and the updated dataset is returned. This is the
        documented "Update Dataset" operation; `POST /{dataset}/versions` remains available as
        an extension for asynchronous publishes. Requires `dataset:UpdateDataset`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetUpdate"
      responses:
        "200":
          description: Dataset updated; the new version was published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: deleteDataset
      tags: [datasets]
      summary: Delete a dataset
      description: |
        Deletes the backing repository, releases the garbage-collection pins of every version
        and removes the control-plane records (§6.6). Object data is not touched.
      responses:
        "204":
          description: Dataset deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /{dataset}/validate:
    parameters:
      - $ref: "#/components/parameters/DatasetName"
    post:
      operationId: validateDataset
      tags: [datasets]
      summary: Validate a dataset definition
      description: |
        Dry run: normalises, resolves branch/tag refs to commits, validates the definition and
        metadata, and authorises the caller against every source. Performs no writes (§10.1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetValidateRequest"
      responses:
        "200":
          description: The resolved definition and a stats estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetValidateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /{dataset}/versions:
    parameters:
      - $ref: "#/components/parameters/DatasetName"
    get:
      operationId: listVersions
      tags: [datasets]
      summary: List dataset versions
      description: Versions newest first (§10.1).
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Amount"
      responses:
        "200":
          description: Version list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetVersionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: publishVersion
      tags: [datasets]
      summary: Publish a new version
      description: |
        Publishes `definition` as version `latest_version + 1` (§5.4, §6.2): materialises the
        definition into the dataset repository, commits `latest`, tags `vN` and records the
        version. `expected_version` behaves like an ETag: a mismatch answers `409` with the
        current `latest_version`. Publishes above `sync_publish_max_objects` answer `202` with a
        task to poll at `GET /{dataset}/tasks/{task_id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionPublishRequest"
      responses:
        "201":
          description: Version published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetVersion"
        "202":
          description: Publish accepted; runs asynchronously
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /{dataset}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/DatasetName"
      - $ref: "#/components/parameters/VersionRef"
    get:
      operationId: getVersion
      tags: [datasets]
      summary: Get a dataset version
      description: |
        `version` is `latest` or `v<N>` (§10.1). Returns the full, resolved definition.
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /{dataset}/refs/{ref}:
    parameters:
      - $ref: "#/components/parameters/DatasetName"
      - $ref: "#/components/parameters/Ref"
    get:
      operationId: getDatasetByRef
      tags: [datasets]
      summary: Get a dataset at a ref
      description: |
        The dataset as it is at `ref`: `latest` or `v<N>`. This is the documented read of one
        dataset revision; the definition and stats are those of the named version.
      responses:
        "200":
          description: Dataset at the ref
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /{dataset}/refs/{leftRef}/diff/{rightRef}:
    parameters:
      - $ref: "#/components/parameters/DatasetName"
      - $ref: "#/components/parameters/LeftRef"
      - $ref: "#/components/parameters/RightRef"
    get:
      operationId: diffRefs
      tags: [datasets]
      summary: Diff two dataset refs
      description: |
        `leftRef` and `rightRef` accept `vN`, `latest` or `pr/<id>` (§10.3).

        `type=definition` (the default) returns a structural diff of the two resolved
        definitions matched by `target`; an item is `changed` when repository, commit, type or
        source path differs. `type=data` is an extension that returns a native graveler diff of
        the dataset repository, paginated, with `_dataset/` entries filtered out.
      parameters:
        - name: type
          in: query
          description: Which diff to compute
          required: false
          schema:
            type: string
            enum: [definition, data]
            default: definition
        - $ref: "#/components/parameters/Prefix"
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Amount"
      responses:
        "200":
          description: |
            Definition diff when `type=definition`, data diff when `type=data`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DatasetDiff"
                  - $ref: "#/components/schemas/DataDiffList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /pulls:
    get:
      operationId: listPullRequests
      tags: [datasets]
      summary: List dataset pull requests
      description: |
        Every dataset pull request (§5.6, §10.1), optionally filtered by `status` and
        `dataset`. Results are filtered by `dataset:ReadDataset` in addition to requiring
        `dataset:ListDatasets`.
      parameters:
        - name: status
          in: query
          required: false
          description: Only return pull requests in this state (`all` is the default)
          schema:
            type: string
            enum: [open, closed, all]
            default: all
        - name: dataset
          in: query
          required: false
          description: Only return pull requests of this dataset
          schema:
            type: string
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Amount"
      responses:
        "200":
          description: Pull request list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetPullRequestList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /{dataset}/pulls:
    parameters:
      - $ref: "#/components/parameters/DatasetName"
    get:
      operationId: listDatasetPullRequests
      tags: [datasets]
      summary: List the pull requests of a dataset
      description: Dataset pull requests, optionally filtered by status (§5.6, §10.1).
      parameters:
        - name: status
          in: query
          required: false
          description: Only return pull requests in this state
          schema:
            type: string
            enum: [open, closed, merged]
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Amount"
      responses:
        "200":
          description: Pull request list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetPullRequestList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: createPullRequest
      tags: [datasets]
      summary: Open a dataset pull request
      description: |
        Materialises the definition on the hidden preview branch `_proposal-<id>` so reviewers
        can browse the actual data, and records the pull request (§5.6). Base version is the
        current `latest_version`; for a dataset that does not exist yet it is 0 and the
        dataset is created when the pull request is merged. Requires
        `dataset:UpdateDataset`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetPullRequestCreate"
      responses:
        "201":
          description: Pull request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetPullRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /{dataset}/pulls/{pullRequest}:
    parameters:
      - $ref: "#/components/parameters/DatasetName"
      - $ref: "#/components/parameters/PullRequestID"
    get:
      operationId: getPullRequest
      tags: [datasets]
      summary: Get a dataset pull request
      description: Includes the definition and data diff summaries against `latest`.
      responses:
        "200":
          description: Pull request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetPullRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    patch:
      operationId: updatePullRequest
      tags: [datasets]
      summary: Update a dataset pull request
      description: |
        Updates the title, description or definition. `status: closed` still closes the pull
        request, exactly like `DELETE`; the documented way to close is `DELETE`. Requires
        `dataset:UpdateDataset`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetPullRequestUpdate"
      responses:
        "200":
          description: Updated pull request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetPullRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: closePullRequest
      tags: [datasets]
      summary: Close a dataset pull request
      description: |
        Closes the pull request and deletes its preview branch without publishing anything
        (§5.6). A pull request that is already closed or merged answers `409`.
      responses:
        "204":
          description: Pull request closed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /{dataset}/pulls/{pullRequest}/diff:
    parameters:
      - $ref: "#/components/parameters/DatasetName"
      - $ref: "#/components/parameters/PullRequestID"
    get:
      operationId: getPullRequestDiff
      tags: [datasets]
      summary: Diff a dataset pull request against latest
      description: |
        The structural diff (§10.3) between the dataset's `latest` and the definition the pull
        request proposes.
      responses:
        "200":
          description: Pull request definition diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetDiff"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /{dataset}/pulls/{pullRequest}/merge:
    parameters:
      - $ref: "#/components/parameters/DatasetName"
      - $ref: "#/components/parameters/PullRequestID"
    post:
      operationId: mergePullRequest
      tags: [datasets]
      summary: Merge a dataset pull request
      description: |
        Publishing the pull request's definition deletes the preview branch and closes the
        pull request (§5.6). Requires `base_version == latest_version`; otherwise `409`
        ("rebase required"). A pull request opened before its dataset existed creates the
        dataset on merge; if the name is taken by then the merge answers `409` and the pull
        request reports `conflicted: true`. The source-read check runs again for the merging
        principal (§9.3). The request has no body.
      responses:
        "200":
          description: Pull request merged; the new version was published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetPullRequestMerge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /{dataset}/access:
    parameters:
      - $ref: "#/components/parameters/DatasetName"
    get:
      operationId: listAccess
      tags: [access]
      summary: List dataset access grants
      description: |-
        Users and groups that hold the managed read policy of this dataset (§9.2). Grants are
        listed by principal type and then principal id; the cursor is `<principal-type>/<principal-id>`
        of the last grant of the previous page.
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Amount"
      responses:
        "200":
          description: Access grant list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessGrantList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: grantAccess
      tags: [access]
      summary: Grant dataset access
      description: |
        Attaches the managed policy `dataset-<name>-read` to a user or group (§9.2). Consumers
        need a grant only on the dataset, never on its sources.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessGrantRequest"
      responses:
        "201":
          description: Access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /{dataset}/access/{principal_type}/{principal_id}:
    parameters:
      - $ref: "#/components/parameters/DatasetName"
      - $ref: "#/components/parameters/PrincipalType"
      - $ref: "#/components/parameters/PrincipalID"
    delete:
      operationId: revokeAccess
      tags: [access]
      summary: Revoke dataset access
      responses:
        "204":
          description: Access revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /{dataset}/tasks/{task_id}:
    parameters:
      - $ref: "#/components/parameters/DatasetName"
      - $ref: "#/components/parameters/TaskID"
    get:
      operationId: getTask
      tags: [datasets]
      summary: Get an asynchronous dataset task
      description: |
        Status of an asynchronous publish (`202` responses, §6.5, §10.1).
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

components:
  securitySchemes:
    basic_auth:
      type: http
      scheme: basic
    jwt_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookie_auth:
      type: apiKey
      in: cookie
      name: internal_auth_session
    oidc_auth:
      type: apiKey
      in: cookie
      name: oidc_auth_session
    saml_auth:
      type: apiKey
      in: cookie
      name: saml_auth_session

  parameters:
    DatasetName:
      name: dataset
      in: path
      required: true
      description: Dataset name; shares the repository namespace (§3)
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{2,62}$"
        maxLength: 63

    VersionRef:
      name: version
      in: path
      required: true
      description: "`latest` or `v<N>`, the documented ref forms"
      schema:
        type: string
        pattern: "^(latest|v[0-9]{1,9})$"

    Ref:
      name: ref
      in: path
      required: true
      description: "`latest` or `v<N>`, the documented ref forms"
      schema:
        type: string
        pattern: "^(latest|v[0-9]{1,9})$"

    LeftRef:
      name: leftRef
      in: path
      required: true
      description: "`latest`, `v<N>` or `pr/<id>` (the `source_ref` of a pull request)"
      schema:
        type: string
        pattern: "^(latest|v[0-9]{1,9}|pr/[0-9A-Za-z]{1,64})$"

    RightRef:
      name: rightRef
      in: path
      required: true
      description: "`latest`, `v<N>` or `pr/<id>` (the `source_ref` of a pull request)"
      schema:
        type: string
        pattern: "^(latest|v[0-9]{1,9}|pr/[0-9A-Za-z]{1,64})$"

    PullRequestID:
      name: pullRequest
      in: path
      required: true
      description: Pull request identifier (ULID)
      schema:
        type: string
        pattern: "^[0-9A-Za-z]{1,64}$"

    TaskID:
      name: task_id
      in: path
      required: true
      description: |
        Task identifier. The placeholder is `task_id` rather than `task` because the shared
        chi server template binds the request context to a variable named `task`; the URL
        shape is `/{dataset}/tasks/<id>` (§10.1).
      schema:
        type: string
        pattern: "^[0-9A-Za-z_-]{1,64}$"

    MetadataKeyName:
      name: key
      in: path
      required: true
      description: Metadata key name (§5.5)
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_]{0,62}$"

    PrincipalType:
      name: principal_type
      in: path
      required: true
      description: Grant principal kind
      schema:
        type: string
        enum: [user, group]

    PrincipalID:
      name: principal_id
      in: path
      required: true
      description: User or group name
      schema:
        type: string
        minLength: 1
        maxLength: 256

    Prefix:
      name: prefix
      in: query
      required: false
      allowEmptyValue: true
      description: Return items whose name starts with this prefix
      schema:
        type: string

    After:
      name: after
      in: query
      required: false
      allowEmptyValue: true
      description: Return items after this value (pagination token)
      schema:
        type: string

    Amount:
      name: amount
      in: query
      required: false
      description: |-
        How many items to return. A value <= 0 means the default page size and a value above
        1000 is clamped to 1000: there is no way to ask for every item at once, so a client
        always follows `pagination.has_more` / `pagination.next_offset` (SEC-5).
      schema:
        type: integer
        minimum: -1
        maximum: 1000
        default: 100

    Search:
      name: search
      in: query
      required: false
      allowEmptyValue: true
      description: Case-insensitive search over dataset name and description
      schema:
        type: string

  responses:
    BadRequest:
      description: |
        The request is malformed or the definition is invalid. The body lists every problem
        (§10.4).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The request is not authenticated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        The caller is missing a required dataset permission, or cannot read one of the source
        repositories/objects referenced by the definition (§9.3). This status is configurable:
        the documented `auth.authorization_failure_status` selects `401` (the default, as in the
        core API) or `403` for denials, so a client must accept either.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The dataset, version, pull request, task, metadata key or source repository was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        The name is unavailable, the version conflicts (`expected_version`, concurrent publish,
        no changes), the pull request base is stale, or a required metadata key change is invalid
        (`type` change). A name clash never says whether the name is held by a dataset or by a
        plain repository (SEC-7).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: |
        A source repository lives in a different storage ID than the dataset (§5.2).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotImplemented:
      description: |
        `table`/`namespace` items are not supported by this build, or datasets are disabled on
        this server (§10.4).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      description: |
        The core lakeFS error shape: a human readable `message`. Validation failures add one
        entry per problem in `errors` (§10.4).
      required:
        - message
      properties:
        message:
          type: string
        errors:
          type: array
          description: Present on `400` responses, one entry per validation problem
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required:
        - message
      properties:
        path:
          type: string
          description: Location of the problem, for example `data[2].target`
          example: "data[2].target"
        message:
          type: string
          example: "target overlaps data[0] (\"customers\")"

    Pagination:
      type: object
      required:
        - has_more
        - max_per_page
        - results
        - next_offset
      properties:
        has_more:
          type: boolean
          description: Next page is available
        next_offset:
          type: string
          description: Token used to retrieve the next page
        results:
          type: integer
          minimum: 0
          description: Number of values found in the results
        max_per_page:
          type: integer
          minimum: 0
          description: Maximum page size

    DatasetMetadata:
      type: object
      description: |
        Dataset metadata (§5.1). On **input** a value is a JSON scalar (string, number or
        boolean) or an array of strings, so the examples of the published documentation keep
        working. On **output** every value is always an array of strings, which is the
        `additionalProperties: {type: array, items: string}` shape of ent-swagger v1.108, so a
        client generated from that spec decodes this API. Values of defined metadata keys are
        validated against their type (§5.5).
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
            items:
              type: string
      maxProperties: 128
      x-go-type: "map[string]interface{}"

    DatasetDefinition:
      type: object
      description: |
        The Enterprise-compatible definition format (§5.1). `format_version` is set by the
        server on write: it may be omitted and is stored as `1`. The data list must not be
        empty - that rule is enforced by the service so the error carries its usual path and
        message - and it is sorted by `target` once validated (§5.2). Stored definitions only
        contain commit refs; branch and tag refs are resolved on input.
      required:
        - data
      properties:
        format_version:
          type: integer
          enum: [1]
          description: Set by the server on write; omitted means 1
        description:
          type: string
          maxLength: 4096
        metadata:
          $ref: "#/components/schemas/DatasetMetadata"
        data:
          type: array
          maxItems: 10000
          description: Must not be empty; sorted by `target` once validated (§5.2)
          items:
            $ref: "#/components/schemas/DataItem"

    DataItem:
      type: object
      description: |
        One source of dataset data, materialised at `target` in the dataset repository (§5.2).

        DataItem is a discriminated union on `type` (oneOf semantics):

          * `type: object`  requires `object` and forbids `prefix`/`table`/`namespace`;
            the source key lands exactly at `target`.
          * `type: prefix`  requires `prefix` and forbids `object`/`table`/`namespace`;
            `prefix/<rel>` lands at `target/<rel>`.
          * `type: table` or `type: namespace` are reserved for the Iceberg phase and answered
            with `501` (§1.2, §10.4).

        The union is modelled as one object with optional per-type members rather than a literal
        OpenAPI `oneOf` because the oapi-codegen release pinned by this repository (v1.5.6, see
        go.sum) encodes `oneOf` as `interface{}`, which would leave the generated server and
        client for the whole definition tree untyped. `pkg/datasets` validation enforces the
        union (§5.2, validate.go); the spec keeps the per-type shape documented and typed.
      required:
        - target
        - repository
        - ref
        - type
      # Machine-readable form of the union above: `type` selects the member schema. The
      # openapi3 validator and pkg/datasets validation both key off `type`.
      x-one-of-by: type
      properties:
        target:
          type: string
          description: |
            Path inside the dataset repository. No leading `/`; `.`/`..` segments and the
            reserved `_dataset/` prefix are rejected; a trailing `/` is only meaningful for
            `prefix` items and is stripped before use (§5.2, §6.4).
          example: "customers"
        repository:
          type: string
          description: Source repository; must not be a dataset and must share the dataset storage ID (§5.2)
          example: "lakehouse-repo"
        ref:
          $ref: "#/components/schemas/SourceRef"
        type:
          type: string
          enum: [object, prefix, table, namespace]
        object:
          $ref: "#/components/schemas/PathSource"
        prefix:
          $ref: "#/components/schemas/PathSource"
        table:
          $ref: "#/components/schemas/TableSource"
        namespace:
          type: string
          description: |
            Iceberg namespace name. ent-swagger v1.108 declares `namespace` as a string, so an
            Enterprise definition decodes; this build still answers the item with `501` (§1.2,
            ICEBERG_CATALOG_PLAN.md).

    SourceRef:
      type: object
      description: |
        The source ref an item is pinned to (§5.3). `branch` and `tag` are accepted on input and
        resolved to a commit id at write time; stored definitions only hold `commit`.
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum: [commit, branch, tag]
        id:
          type: string
          example: "30f9eb1c9a3d4b8e8f0d0a6c1b7e5f2a9c4d3e1f"

    PathSource:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: |
            Source path inside the repository. For `prefix` items a missing trailing `/` is
            added, and an empty path means the whole repository (§5.2).
          example: "data/customers/"
          maxLength: 1024

    TableSource:
      type: object
      description: Reserved for Iceberg `table` items; answered with `501` in this build (§1.2)
      additionalProperties: {}

    Dataset:
      type: object
      description: |
        One dataset (§10.1). `id` is the dataset name and `creation_date` is Unix epoch
        seconds. `version` is the latest published version, absent (or 0) when nothing was
        published yet. `definition` carries the per-item source-resolution status.
      required:
        - id
        - creation_date
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{2,62}$"
          maxLength: 63
        description:
          type: string
          maxLength: 4096
        creation_date:
          type: integer
          format: int64
          description: Unix epoch seconds
        version:
          type: integer
          description: Latest published version; 0 when no version was published yet
        definition:
          $ref: "#/components/schemas/DatasetDefinitionState"
        # --- extensions of this implementation ---
        created_by:
          type: string
        state:
          type: string
          enum: [creating, active, publishing, deleting, degraded]
        stats:
          $ref: "#/components/schemas/DatasetStats"

    DatasetDefinitionState:
      type: object
      description: |
        The definition of a dataset version plus the per-item source-resolution status. The
        status tells a consumer which items it cannot read and why, without failing the read.
      properties:
        format_version:
          type: integer
        description:
          type: string
        metadata:
          $ref: "#/components/schemas/DatasetMetadata"
        data:
          type: array
          items:
            $ref: "#/components/schemas/DataItemState"

    DataItemState:
      description: |
        A data item plus its source-resolution status: `ok`, `source_repo_unavailable` (the
        source repository is gone), `source_ref_unavailable` (the pinned ref is gone) or
        `caller_unauthorized` (the caller cannot read the source).
      allOf:
        - $ref: "#/components/schemas/DataItem"
        - type: object
          properties:
            status:
              type: string
              enum: [ok, source_repo_unavailable, source_ref_unavailable, caller_unauthorized]
    DatasetList:
      type: object
      required:
        - results
        - pagination
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Dataset"
        pagination:
          $ref: "#/components/schemas/Pagination"

    DatasetStats:
      type: object
      required:
        - objects
        - bytes
        - items
      properties:
        objects:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemStats"

    ItemStats:
      type: object
      required:
        - target
        - objects
        - bytes
      properties:
        target:
          type: string
        objects:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64

    DatasetVersion:
      type: object
      description: One immutable dataset version (§5.3).
      required:
        - id
        - author
        - creation_date
      properties:
        id:
          type: string
          description: Version id, `v<N>`
          pattern: "^v[0-9]{1,9}$"
        message:
          type: string
        author:
          type: string
        creation_date:
          type: integer
          format: int64
          description: Unix epoch seconds
        # --- extensions of this implementation ---
        commit_id:
          type: string
          description: Commit in the dataset repository
        proposal_id:
          type: string
          description: Set when the version was published by merging a pull request
        definition:
          $ref: "#/components/schemas/DatasetDefinition"
        stats:
          $ref: "#/components/schemas/DatasetStats"

    DatasetVersionList:
      type: object
      required:
        - results
        - pagination
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DatasetVersion"
        pagination:
          $ref: "#/components/schemas/Pagination"
    StringChange:
      type: object
      required:
        - left
        - right
      properties:
        left:
          type: string
        right:
          type: string

    MetadataChange:
      type: object
      required:
        - type
        - key
      properties:
        type:
          type: string
          enum: [added, removed, changed]
        key:
          type: string
        left:
          type: array
          items:
            type: string
          description: Values on the left side (absent when added)
        right:
          type: array
          items:
            type: string
          description: Values on the right side (absent when removed)

    ItemChange:
      type: object
      required:
        - type
        - target
      properties:
        type:
          type: string
          enum: [added, removed, changed]
        target:
          type: string
        left:
          $ref: "#/components/schemas/DataItem"
        right:
          $ref: "#/components/schemas/DataItem"

    DatasetDiff:
      type: object
      description: Structural diff of two resolved definitions, matched by `target` (§10.3).
      required:
        - data
      properties:
        format_version:
          type: integer
        description:
          $ref: "#/components/schemas/StringChange"
        metadata:
          type: array
          items:
            $ref: "#/components/schemas/MetadataChange"
        data:
          type: array
          items:
            $ref: "#/components/schemas/ItemChange"
    DataDiffEntry:
      type: object
      description: One entry of a data diff; same shape as the core API diff (§10.2).
      required:
        - path
        - type
      properties:
        path:
          type: string
        type:
          type: string
          enum: [added, removed, changed]
        size_bytes:
          type: integer
          format: int64

    DataDiffList:
      type: object
      description: Paginated data diff of the dataset repository (§10.2, §10.3).
      required:
        - results
        - pagination
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DataDiffEntry"
        pagination:
          $ref: "#/components/schemas/Pagination"

    DatasetPullRequest:
      type: object
      description: A dataset pull request (§5.6).
      required:
        - id
        - dataset
        - title
        - author
        - status
        - base_version
        - latest_version
        - stale
        - conflicted
        - source_ref
        - creation_date
      properties:
        id:
          type: string
        dataset:
          type: string
        title:
          type: string
          maxLength: 256
        description:
          type: string
          maxLength: 4096
        author:
          type: string
        status:
          type: string
          enum: [open, closed, merged]
        base_version:
          type: integer
          description: Version the pull request was made against; merging requires it to be latest
        latest_version:
          type: integer
          description: Latest version of the dataset at read time (0 when it does not exist)
        stale:
          type: boolean
          description: base_version differs from latest_version, so the pull request must be updated first
        conflicted:
          type: boolean
          description: |
            The dataset's name is unavailable (a pull request opened before the dataset
            existed, and the name has since been taken). Merging it answers 409.
        source_ref:
          type: string
          description: The ref the pull request is materialised on, `pr/<id>`
        creation_date:
          type: integer
          format: int64
          description: Unix epoch seconds
        closed_date:
          type: integer
          format: int64
          description: Unix epoch seconds; set when closed or merged
        # --- extensions of this implementation ---
        definition:
          $ref: "#/components/schemas/DatasetDefinition"
        merged_version:
          type: integer
          description: Version produced by the merge
        preview_branch:
          type: string
          description: Hidden branch `_proposal-<id>` holding the materialised definition
        diff:
          $ref: "#/components/schemas/DatasetDiff"
        data_diff:
          $ref: "#/components/schemas/DataDiffList"

    DatasetPullRequestList:
      type: object
      required:
        - results
        - pagination
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DatasetPullRequest"
        pagination:
          $ref: "#/components/schemas/Pagination"

    DatasetPullRequestMerge:
      type: object
      description: The result of merging a pull request (§5.6).
      required:
        - version
        - reference
      properties:
        version:
          type: integer
          description: Version produced by the merge
        reference:
          type: string
          description: The dataset ref the merge produced, `v<N>`
    MetadataKey:
      type: object
      description: A typed metadata key (§5.5).
      required:
        - name
        - type
        - required
        - allow_multiple
        - created_at
        - created_by
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,62}$"
        type:
          type: string
          enum: [string, enum, number, boolean, date]
        required:
          type: boolean
          description: Enforced on every definition write, not on existing versions
        allowed_values:
          type: array
          description: Non-empty for `enum` keys only
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 256
        allow_multiple:
          type: boolean
          description: The value is a JSON array
        description:
          type: string
          maxLength: 4096
        created_at:
          type: integer
          format: int64
          description: Unix epoch milliseconds
        created_by:
          type: string

    MetadataKeyList:
      type: object
      required:
        - results
        - pagination
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/MetadataKey"
        pagination:
          $ref: "#/components/schemas/Pagination"

    MetadataKeyCreateRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,62}$"
        type:
          type: string
          enum: [string, enum, number, boolean, date]
        required:
          type: boolean
          default: false
        allowed_values:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 256
        allow_multiple:
          type: boolean
          default: false
        description:
          type: string
          maxLength: 4096

    MetadataKeyUpdateRequest:
      type: object
      description: |
        Full replacement (`DatasetMetadataKeyUpdate`). `type` is required and immutable
        (§5.5); changing the name is a delete plus create.
      required:
        - type
      properties:
        type:
          type: string
          enum: [string, enum, number, boolean, date]
        required:
          type: boolean
          default: false
        allowed_values:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 256
        allow_multiple:
          type: boolean
          default: false
        description:
          type: string
          maxLength: 4096

    Task:
      type: object
      description: An asynchronous dataset task, for example a large publish (§6.5, §10.1).
      required:
        - id
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        version:
          type: integer
          description: Version produced once completed
        error:
          $ref: "#/components/schemas/TaskError"
        created_at:
          type: integer
          format: int64
          description: Unix epoch milliseconds
        updated_at:
          type: integer
          format: int64
          description: Unix epoch milliseconds

    TaskError:
      type: object
      description: |
        The sanitised failure of a failed task (SEC-8): a stable `code` and a fixed `message`.
        The underlying error - which can name block and physical addresses - stays in the
        server log and is never returned here.
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum: [publish_failed, permission_denied, source_unavailable]
        message:
          type: string

    AccessGrant:
      type: object
      description: A principal holding the managed read policy of a dataset (§9.2).
      required:
        - principal_type
        - principal_id
      properties:
        principal_type:
          type: string
          enum: [user, group]
        principal_id:
          type: string
        granted_by:
          type: string
        granted_at:
          type: integer
          format: int64
          description: Unix epoch milliseconds

    AccessGrantList:
      type: object
      required:
        - results
        - pagination
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/AccessGrant"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AccessGrantRequest:
      type: object
      required:
        - principal_type
        - principal_id
      properties:
        principal_type:
          type: string
          enum: [user, group]
        principal_id:
          type: string
          minLength: 1
          maxLength: 256

    DatasetsConfig:
      type: object
      description: Configuration the UI needs to gate itself (§10.1, §11).
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        storage_id:
          type: string
        max_items:
          type: integer
        access_model:
          type: string
          enum: [open, strict]
        sync_publish_max_objects:
          type: integer
          format: int64

    DatasetCreateRequest:
      type: object
      description: |
        Definition envelope used by create (§5.1, §10.1). The create always publishes version
        `v1`; `publish` only carries the version message, which defaults to
        `Create dataset <name>`.
      required:
        - name
        - definition
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{2,62}$"
          maxLength: 63
        definition:
          $ref: "#/components/schemas/DatasetDefinition"
        publish:
          $ref: "#/components/schemas/PublishOptions"

    DatasetUpdate:
      type: object
      description: "Body of `PUT /datasets/{dataset}` (§10.1): a new definition and its publish message."
      required:
        - definition
        - publish
      properties:
        definition:
          $ref: "#/components/schemas/DatasetDefinition"
        publish:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              maxLength: 4096
    PublishOptions:
      type: object
      description: |
        Publish instruction of a create. The create always publishes `v1`; this only supplies
        the version message, which defaults to `Create dataset <name>`.
      properties:
        message:
          type: string
          maxLength: 4096

    VersionPublishRequest:
      type: object
      description: Body of `POST /{dataset}/versions` (§10.1).
      required:
        - definition
        - message
      properties:
        definition:
          $ref: "#/components/schemas/DatasetDefinition"
        message:
          type: string
          maxLength: 4096
        expected_version:
          type: integer
          description: |
            Optimistic concurrency check, like an ETag: when it does not match `latest_version`
            the request fails with `409` carrying the current `latest_version` (§5.4).

    DatasetValidateRequest:
      type: object
      required:
        - definition
      properties:
        definition:
          $ref: "#/components/schemas/DatasetDefinition"

    DatasetValidateResponse:
      type: object
      description: "Dry-run result: the resolved definition plus a stats estimate (§10.1)."
      required:
        - definition
      properties:
        definition:
          $ref: "#/components/schemas/DatasetDefinition"
        stats:
          $ref: "#/components/schemas/DatasetStats"

    DatasetPullRequestCreate:
      type: object
      required:
        - definition
        - title
      properties:
        definition:
          $ref: "#/components/schemas/DatasetDefinition"
        title:
          type: string
          maxLength: 256
        description:
          type: string
          maxLength: 4096

    DatasetPullRequestUpdate:
      type: object
      description: "Partial update; `status: closed` closes the pull request (§10.1)."
      properties:
        title:
          type: string
          maxLength: 256
        description:
          type: string
          maxLength: 4096
        definition:
          $ref: "#/components/schemas/DatasetDefinition"
        status:
          type: string
          enum: [closed]
