# Example lakeFS configuration for Azure Entra ID SSO (lakefs-sso binary).
# Copy to lakefs.yaml and fill in the placeholders.
#
# Prerequisites:
#   1. Register a web application in Azure Entra ID.
#   2. Add a redirect URI: https://<your-lakefs-host>/api/v1/oidc/callback
#   3. Create App Roles (e.g. "Admins", "Writers", "Readers") and assign users.
#   4. Grant API permissions: openid, profile, email (delegated).
#   5. Run `lakefs-sso sso-migrate` once on an existing install to move the admin
#      user from BasicAuthService to the ACL service before enabling SSO.

database:
  type: postgres
  postgres:
    connection_string: "postgres://lakefs:password@localhost/lakefs?sslmode=disable"

# Logging. The REST API and the S3 gateway write one "HTTP call ended" line per request. In
# rbac: internal mode those lines are audit lines and carry log_audit=true, the client, the
# response size (sent_bytes) and the request ID; in rbac: simplified they are logged without
# those fields.
logging:
  # Minimum severity that reaches the output: trace, debug, info (default), warn, error.
  level: "INFO"

  # Severity of the per-request audit lines. They are written at this level and then filtered by
  # `level` above, so audit_log_level must be at or below level: with the binary defaults
  # (audit_log_level DEBUG, level INFO) no audit line is emitted at all, which silently defeats
  # log shipping. INFO gives one audit line per request.
  audit_log_level: "INFO"

  # "text" (default) or "json". JSON is the usual choice when shipping to a log store.
  # format: "text"

  # Where to write. Any mix of "-" (stdout, the default), "=" (stderr) and file paths
  # (rotated by file_max_size_mb / files_keep).
  # output:
  #   - "-"

auth:
  # Redirect here after /logout — Azure's end_session_endpoint clears the IdP session.
  # Replace <tenant-id> and the post_logout_redirect_uri with your actual values.
  logout_redirect_url: "https://login.microsoftonline.com/<tenant-id>/oauth2/v2.0/logout?post_logout_redirect_uri=https://<your-lakefs-host>/auth/login"

  # Authorization cache. Effective policies are cached per user and per process. Attaching
  # or detaching a policy, and group sync at login, take effect immediately on the replica
  # that handled the request; other replicas converge only within the TTL plus jitter.
  # For multi-replica deployments set a short TTL so revocation propagates quickly
  # (RBAC_DESIGN.md §4.7):
  # cache:
  #   ttl: 5s

  # HTTP status returned for authorization failures (insufficient permissions).
  #   401 — default. The web UI and the SDK clients treat a 401 without the authentication
  #         message as an authorization error, and the API does not declare 403 on these
  #         endpoints.
  #   403 — opt in to "forbidden" responses, for example when a proxy or client in front of
  #         lakeFS distinguishes "not authenticated" (401) from "not allowed" (403).
  # Only 401 and 403 are accepted; any other value (for example a typo such as 200, which
  # would make a denial look like a success) fails startup with a clear error.
  # authorization_failure_status: 401

  ui_config:
    # RBAC mode. lakefs-sso defaults to "simplified" whenever sso.enabled is true.
    #   simplified — ACL mode: one permission dropdown per group (Admins / Supers /
    #                Writers / Readers). Also the fallback for an unset value, "none",
    #                and "external" (SSO has no remote auth service; "external" is
    #                rejected with a warning).
    #   internal   — policy-based RBAC: full Users / Groups / Policies UI, plus
    #                repository-, branch-, path- and IP-scoped policies, ${user}
    #                self-service and audit request logging. Opt-in (RBAC_DESIGN.md §4).
    # Both modes run on the same ACL KV backend, so switching is a config change plus the
    # `lakefs-sso rbac-migrate` step described in CHANGELOG_SSO.md.
    rbac: "simplified"
    login_url: "/oidc/login"

    # SSO-first login. "redirect" sends the browser straight to fallback_login_url; the
    # "Continue with ..." card is shown only after a failed SSO round-trip or on
    # /auth/login?local=true. "select" always shows the card. Access keys stay
    # available behind the card's "Sign in with access key" link.
    login_url_method: "redirect"
    fallback_login_url: "/oidc/login"
    # A label mentioning Microsoft/Azure/Entra gets the Microsoft logo on the button.
    fallback_login_label: "Continue with Microsoft"

    # Cookies whose absence means "not logged in" — the UI uses this list to detect
    # whether to show the login page.  Must include oidc_auth_session for SSO users.
    login_cookie_names:
      - "internal_auth_session"
      - "oidc_auth_session"

# Client IP resolution for IpAddress / SourceIp policy conditions (and audit logs).
# By default lakeFS does NOT trust X-Forwarded-For or X-Real-IP: the client IP is the transport
# peer address (RemoteAddr), so a caller cannot spoof the IP that an IP-conditioned policy sees.
# If lakeFS runs behind a reverse proxy or load balancer, list that proxy here; only then are the
# forwarding headers honoured, walking X-Forwarded-For from right to left to the first untrusted
# hop. Use CIDRs, single IPs, or "*" to trust every peer (which restores the old, spoofable
# behaviour and should be used only when the proxy strips client-supplied forwarding headers).
# This is a behaviour change from earlier versions, which always trusted the leftmost XFF entry:
# deployments behind a proxy that do not configure this will see the proxy address as the client.
# security:
#   trusted_proxies:
#     - "10.0.0.0/8"
#     - "2001:db8:1::/48"

sso:
  enabled: true
  client_id: "<Application (client) ID from Azure>"
  client_secret: "<Client secret value>"
  issuer_url: "https://login.microsoftonline.com/<tenant-id>/v2.0"
  callback_base_url: "https://<your-lakefs-host>"
  # Optional. Full redirect_uri sent to Entra, exactly as registered in the app. Overrides
  # callback_base_url + /api/v1/oidc/callback. Env: LAKEFS_SSO_CALLBACK_URL.
  # callback_url: "https://<your-lakefs-host>/oidc/callback"

  # Claim that uniquely identifies the user.  Azure Entra ID uses "oid" (object ID).
  user_id_claim: "oid"

  # Claim shown as the display name in lakeFS.
  friendly_name_claim: "preferred_username"

  # OpenID Connect scopes to request.
  scopes:
    - "openid"
    - "profile"
    - "email"

  # --- Group synchronisation (optional) ---
  # Synchronise ACL group membership on every login based on App Role assignments.
  # The token claim that carries App Role names (set in the Azure app manifest).
  groups_claim: "roles"

  # Enable sync on every login.
  sync_groups_on_login: true

  # Only touch ACL groups whose name starts with this prefix; other group memberships
  # (e.g. manually assigned) are left intact.  Leave empty to manage all groups.
  # Example: if prefix is "lakefs-", the token role "lakefs-Admins" maps to the
  # local ACL group "Admins".
  managed_group_prefix: ""

  # Extra parameters forwarded to the Azure authorization endpoint.
  # prompt: select_account forces the account-picker on every login.
  authorize_params:
    prompt: "select_account"

# Datasets control plane (DATASETS_DESIGN.md §13). Disabled by default.
# Every key can also be set through the environment: LAKEFS_DATASETS_ENABLED,
# LAKEFS_DATASETS_STORAGE_NAMESPACE_PREFIX, LAKEFS_DATASETS_STORAGE_ID, ...
# A dataset is materialised as a read-only repository, so its storage must be the same
# blockstore as its sources.
# datasets:
#   enabled: false
#   # Blockstore that holds dataset repositories. "" is the default single blockstore; it must
#   # equal the storage ID of every source repository.
#   storage_id: ""
#   # Namespace prefix for dataset repositories (<prefix>/<name>-<ulid>). Required when enabled,
#   # and it must be a namespace the configured blockstore can parse (e.g. s3://bucket/prefix).
#   storage_namespace_prefix: "s3://my-bucket/lakefs-datasets"
#   max_items: 1000
#   allow_empty_items: false
#   sync_publish_max_objects: 100000   # larger publishes run async (202 + task)
#   merge_fan_in: 64
#   publish_timeout: 30m
#   reconcile_interval: 10m
#   access_model: open                 # open | strict (strict is not implemented yet)
#   immutable_guard_groups: []         # extra groups that get the immutability deny policy
#   metadata:
#     strict: false                    # reject metadata keys that are not defined
