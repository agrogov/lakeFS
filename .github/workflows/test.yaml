name: Test
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  license-base:
    name: Check licence base
    runs-on: ubuntu-24.04
    steps:
      - name: Check-out code
        uses: actions/checkout@v6
        with:
          # The guard compares HEAD against the upstream BSL 1.1 relicense commit,
          # which only exists in the treeverse history, not in this fork's origin.
          # A full clone keeps the ancestry check conclusive (see the guard script).
          fetch-depth: 0
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/treeverse/lakeFS.git ||
            git remote set-url upstream https://github.com/treeverse/lakeFS.git
      - name: Self-test the guard
        run: bash scripts/check-license-base.sh --self-test
      - name: Check that no BSL 1.1 upstream commit is an ancestor
        run: bash scripts/check-license-base.sh

  validator:
    name: Run Linters and Checkers
    runs-on: ubuntu-24.04-8-cores
    steps:
      - name: Check-out code
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - uses: actions/setup-node@v6
        with:
          node-version: "22.17.x"
          cache: "npm"
          cache-dependency-path: webui/package-lock.json
      - uses: bufbuild/buf-setup-action@v1.50.0
        with:
          github_token: ${{ github.token }}
          version: 1.54.0
      - name: Generate code
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          make gen validate-clients-untracked-files
#      - name: Ensure Go workspace is synced
#        run: |
#          go work sync
#          echo "Git status after go work sync:"
#          git status
#          [ ! -n "$(git status --porcelain)" ]
      - name: Checks validator
        run: make checks-validator

  test-go:
    name: Run Go tests
    runs-on: ubuntu-24.04-16-cores
    steps:
      - name: Check-out code
        uses: actions/checkout@v6
        
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Run Go tests
        run: make test-go

  test-webui:
    name: Run webui unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check-out code
        uses: actions/checkout@v6
      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version-file: webui/package.json
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: npm test
        working-directory: webui
